## IDF Component Manager manifest.
##
## esp-mqtt was removed from ESP-IDF core in 6.0 and is now a managed component.
## The headers and APIs are unchanged (mqtt_client.h); only the delivery changed.
dependencies:
  idf:
    version: '>=6.0.0'
  # Pinned to a range rather than '*' so builds are reproducible.
  espressif/mqtt: '>=1.1.0,<2.0.0'
