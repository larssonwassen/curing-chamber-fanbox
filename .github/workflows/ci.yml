name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # Builds for the target. This is what catches the case-sensitivity class of
  # bug: the project developed on macOS APFS, where JSONBuilder/ and JsonBuilder/
  # are the same directory and a mismatched include still compiles.
  firmware:
    runs-on: ubuntu-latest
    # Creating the release needs write access. The default token is read-only
    # here, and without this the tag build gets a 403 from the releases API
    # after a three-minute build.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.image.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # A tag is a claim about what the image reports as its version, and
      # ThingsBoard compares that string against the package it was told to
      # install. A tag that disagrees with PROJECT_VER would produce a package
      # the device downloads, installs, and then still considers out of date --
      # an update loop. Refuse to build rather than ship that.
      - name: Tag must match PROJECT_VER
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^set(PROJECT_VER "\(.*\)")/\1/p' CMakeLists.txt)"
          echo "tag=$tag  PROJECT_VER=$ver"
          test "$tag" = "$ver" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match PROJECT_VER $ver"
            exit 1
          }

      - name: Build with ESP-IDF 6.0
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3

      # Named by version so a downloaded file is still identifiable later, and
      # accompanied by its SHA-256 so the checksum ThingsBoard computes on
      # upload can be checked against the one CI saw.
      - name: Name the image and checksum it
        id: image
        run: |
          ver="$(sed -n 's/^set(PROJECT_VER "\(.*\)")/\1/p' CMakeLists.txt)"
          mkdir -p dist
          cp build/curing-chamber-fanbox.bin "dist/curing-chamber-fanbox-${ver}.bin"
          ( cd dist && sha256sum "curing-chamber-fanbox-${ver}.bin" > "curing-chamber-fanbox-${ver}.bin.sha256" )
          cat "dist/curing-chamber-fanbox-${ver}.bin.sha256"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      # Every build, including pull requests. Retained by GitHub for a limited
      # time and served as a zip that needs a login -- fine for testing a branch,
      # not a URL to hand to anything else.
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.image.outputs.version }}
          path: dist/
          if-no-files-found: error

      # Tags only. A release asset is a permanent, unauthenticated URL on a
      # public repo, which is the thing worth pointing a script or a person at:
      #   https://github.com/<owner>/<repo>/releases/download/<tag>/<file>.bin
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.bin
            dist/*.bin.sha256
          generate_release_notes: true

  # Tags only, and only once the image itself is published. Uploading a package
  # to ThingsBoard is inert -- it becomes an available firmware, nothing more.
  # Assignment, which is what actually starts an update on the device in the
  # chamber, stays a manual decision made by a person looking at that device.
  #
  # Skipped silently when the secrets are absent, so a fork can still build.
  thingsboard:
    needs: firmware
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware-${{ needs.firmware.outputs.version }}
          path: dist

      - name: Upload to ThingsBoard
        env:
          TB_URL: ${{ vars.TB_URL }}
          TB_API_KEY: ${{ secrets.TB_API_KEY }}
          TB_USERNAME: ${{ secrets.TB_USERNAME }}
          TB_PASSWORD: ${{ secrets.TB_PASSWORD }}
          TB_DEVICE_PROFILE_NAME: ${{ vars.TB_DEVICE_PROFILE_NAME }}
          TB_DEVICE_PROFILE_ID: ${{ vars.TB_DEVICE_PROFILE_ID }}
          VERSION: ${{ needs.firmware.outputs.version }}
        run: |
          if [ -z "$TB_URL" ] || { [ -z "$TB_API_KEY" ] && [ -z "$TB_PASSWORD" ]; }; then
            echo "::notice::ThingsBoard credentials not configured; skipping upload"
            exit 0
          fi
          ./tools/tb_upload_firmware.sh "dist/curing-chamber-fanbox-${VERSION}.bin" "$VERSION"

  # The parsing code is target-independent, so it can run under the sanitizers
  # on the host. These cover the paths that take untrusted input: MQTT payloads
  # and log text.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C test/host
